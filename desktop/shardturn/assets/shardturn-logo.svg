<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="260" viewBox="0 0 1100 260" role="img" aria-labelledby="title desc">
  <title id="title">Shardturn — The Color Card Duel</title>
  <desc id="desc">Four-facet emblem and upright Shardturn wordmark on a warm ivory background.</desc>
  <rect width="1100" height="260" fill="#fcfaf5"/>
  <!-- Same normalized geometry and rotations as Painter.emblem. -->
  <g transform="translate(132 130) scale(84)">
    <polygon points="0,-1 .86,-.18 .12,-.09 -.34,-.5" fill="#ce6655"/>
    <polygon points="0,-1 .86,-.18 .12,-.09 -.34,-.5" transform="rotate(90)" fill="#c79a36"/>
    <polygon points="0,-1 .86,-.18 .12,-.09 -.34,-.5" transform="rotate(180)" fill="#358d7d"/>
    <polygon points="0,-1 .86,-.18 .12,-.09 -.34,-.5" transform="rotate(270)" fill="#7c6fbb"/>
  </g>
  <text x="266" y="137" fill="#292a43" font-family="DejaVu Sans, sans-serif" font-size="76" font-weight="700" letter-spacing="3">SHARDTURN</text>
  <text x="270" y="184" fill="#66667b" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="400" letter-spacing="3.4">THE COLOR CARD DUEL</text>
</svg>
