name: Final public website and RC2 checks
on:
  push:
    branches: [publish/daylight-website-final]
    paths: [.github/workflows/daylight-finalize-website.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daylight-final-readonly-verification
  cancel-in-progress: false
jobs:
  website:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2de81327cc76a889f693997358a7952d32af4822
          persist-credentials: false
      - name: Check exact published source and build static resources
        run: |
          set -eu
          test "$(git rev-parse HEAD^{tree})" = 54dc561f7cc56f1a51f4be1b89aacd35c97691a2
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil imagemagick librsvg2-bin fonts-dejavu-core
          mkdir -p dist/site-pi-qa
          git rev-parse HEAD > dist/site-pi-qa/verified-source.txt
          sh scripts/render-assets.sh
          python3 website/build.py --output dist/site
      - name: Verify structure and existing installer/site regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/test_website.py --site dist/site | tee dist/site-pi-qa/structure.json
          python3 tests/test_release_tools.py 2>&1 | tee dist/site-pi-qa/regression.log
      - name: Test desktop, mobile, keyboard and no-JavaScript navigation
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/daylight-web" --ignore-scripts --no-audit --no-fund playwright@1.55.0
          export DAYLIGHT_PLAYWRIGHT="$RUNNER_TEMP/daylight-web/node_modules/playwright"
          export DAYLIGHT_BROWSER="$(command -v google-chrome || command -v chromium)"
          python3 -m http.server 34402 --bind 127.0.0.1 --directory dist/site > /tmp/daylight-web-preview.log 2>&1 &
          preview=$!
          trap 'kill "$preview" 2>/dev/null || true' EXIT
          sleep 1
          node tests/test_website_browser.cjs
      - name: Retain inspectable website checks
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-final-website-${{ github.run_number }}
          path: dist/site-pi-qa/
          retention-days: 14
          if-no-files-found: warn
  public-installer:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 2de81327cc76a889f693997358a7952d32af4822
          persist-credentials: false
      - name: Exercise the deployed signed RC2 installer in a disposable container
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/public-client
          docker run --rm --cpus=2 --memory=1g --pids-limit=256 \
            -e DAYLIGHT_DISPOSABLE_TEST=yes -v "$PWD:/src:ro" \
            debian:${{ matrix.suite }} sh /src/release/test-public-install.sh \
            2>&1 | tee dist/public-client/${{ matrix.suite }}.log
          grep -q 'DAYLIGHT_PUBLIC_INSTALLER_LIFECYCLE_OK' dist/public-client/${{ matrix.suite }}.log
          grep -q 'Daylight GNU/Linux 5.0.0-rc.2' dist/public-client/${{ matrix.suite }}.log
      - name: Retain public RC2 lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-final-client-${{ matrix.suite }}-${{ github.run_number }}
          path: dist/public-client/
          retention-days: 14
          if-no-files-found: warn
