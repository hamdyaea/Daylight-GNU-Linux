name: Publish verified Daylight candidate
on:
  push:
    branches: [build/daylight-v5-rc2]
    paths: [release/READY.json]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: daylight-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publication inspection prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
      - name: Publish only exact validated artifacts and verified uploaded bytes
        run: python3 release/publish.py
