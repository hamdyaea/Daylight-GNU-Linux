name: Publish validated native browser preview
on:
  push:
    branches: [publish/browser-native-20261102]
    paths: [.github/workflows/publish-native-preview.yml]
permissions:
  contents: write
  actions: write
concurrency:
  group: daylight-native-preview-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 161ad376fc4e01a06aaea0236b6f67ed095ecf03
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve only the exact reviewed public source snapshot
        shell: bash
        run: |
          set -euo pipefail
          curl --disable --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --retry 3 --connect-timeout 10 --max-time 90 --max-filesize 2000000 \
            https://daylightlinux.ch/media/source/daylight-native-source-593c8f6e23ca.zip -o "$RUNNER_TEMP/daylight-native.zip"
          echo 'aaa2ddc4b5e053611acd2abcc8d1b40f92439c464b8c66bff1d49e8ee989d973  '"$RUNNER_TEMP/daylight-native.zip" | sha256sum -c -
          python3 - <<'PY'
          import os, pathlib, stat, zipfile
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'daylight-native.zip'
          if archive.stat().st_size!=1255122: raise SystemExit('Unexpected source archive size')
          root=pathlib.Path.cwd()
          with zipfile.ZipFile(archive) as bundle:
              entries=bundle.infolist()
              if len(entries)!=210 or sum(e.file_size for e in entries)!=1587766:
                  raise SystemExit('Unexpected source inventory')
              seen=set()
              for entry in entries:
                  parts=pathlib.PurePosixPath(entry.filename)
                  if not parts.parts or parts.parts[0]!='daylight-source' or parts.is_absolute() or '..' in parts.parts or '.git' in parts.parts:
                      raise SystemExit('Unsafe archive path')
                  if stat.S_ISLNK(entry.external_attr>>16): raise SystemExit('Source symlinks rejected')
                  relative=pathlib.Path(*parts.parts[1:])
                  if relative==pathlib.Path('.'): continue
                  if str(relative) in seen: raise SystemExit('Duplicate source entry')
                  seen.add(str(relative))
                  target=root/relative
                  if target.is_symlink() or root not in target.resolve().parents:
                      raise SystemExit('Source path escapes checkout')
                  if entry.is_dir(): target.mkdir(parents=True,exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      target.write_bytes(bundle.read(entry))
                      target.chmod(0o755 if (entry.external_attr>>16)&0o111 else 0o644)
          PY
          git add --all
          test "$(git write-tree)" = dec3f1bdfa18a9ebb3d63d5ac94ce8c84bcff0b1
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows/)"
      - name: Check cache-selection regressions and source syntax
        run: |
          python3 tests/test_web_live_interface.py
          python3 -m py_compile server/deploy-web-live.py web-live/*.py
          node --check web-live/demo.js
          node --check web-live/test-browser.cjs
          node --check web-live/test-transfer.cjs
      - name: Publish without rewriting existing history or workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Hamdy Abou El Anein'
          git config user.email 'info@daylightlinux.ch'
          git commit -m 'Publish native graphical applications and verified bounded transport recovery [skip ci]'
          gh auth setup-git
          git fetch origin master
          test "$(git rev-parse FETCH_HEAD)" = 161ad376fc4e01a06aaea0236b6f67ed095ecf03
          git merge-base --is-ancestor FETCH_HEAD HEAD
          git push --atomic origin HEAD:refs/heads/master HEAD:refs/heads/finish/browser-native-20261102
          git rev-parse HEAD
      - name: Launch independent checks of the actual public deployment
        run: |
          gh workflow run daylight-public-preview.yml --ref master
          gh workflow run daylight-website.yml --ref master
          gh workflow run daylight-source-sync.yml --ref master
