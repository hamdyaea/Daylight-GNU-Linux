name: Verify deployed public APT installer
on:
  push:
    branches: [build/daylight-v5-rc2]
    paths: [.github/workflows/daylight-source-sync.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-client:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        suite: [bookworm, trixie]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install from actual public HTTPS, verify repeatability, then remove
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/public-client
          docker run --rm --cpus=2 --memory=1g --pids-limit=256 \
            -e DAYLIGHT_DISPOSABLE_TEST=yes -v "$PWD:/src:ro" \
            debian:${{ matrix.suite }} sh /src/release/test-public-install.sh \
            2>&1 | tee dist/public-client/${{ matrix.suite }}.log
      - name: Retain deployed installer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-public-client-${{ matrix.suite }}-${{ github.run_number }}
          path: dist/public-client/
          retention-days: 14
