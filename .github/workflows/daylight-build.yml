name: Daylight candidate validation
on:
  push:
    branches: [master, build/daylight-v5, build/daylight-v5-rc2]
    paths-ignore: ['docs/**', '*.md', 'release/**', '.github/workflows/daylight-release.yml', '.github/workflows/daylight-prepare-rc2.yml', '.github/workflows/daylight-source-sync.yml', 'website/**', 'tests/test_website*', '.github/ISSUE_TEMPLATE/**', '.github/workflows/daylight-website.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: daylight-${{ github.ref }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build prerequisites in the disposable runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev imagemagick librsvg2-bin fonts-dejavu-core python3 python3-pil python3-venv curl gnupg qemu-system-x86 xorriso ovmf novnc websockify
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
      - name: Source checks and Rust unit tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/validation
          cargo +1.88.0 fmt --check
          cargo +1.88.0 clippy --locked --all-targets -- -D warnings
          cargo +1.88.0 test --locked 2>&1 | tee dist/validation/rust-tests.log
          python3 -m py_compile scripts/*.py tests/*.py telemetry/*.py server/*.py demo/*.py website/*.py
          for file in scripts/*.sh server/*.sh demo/*.sh; do sh -n "$file"; done
      - name: Build and test the exact AMD64 and ARM64 candidate packages
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/render-assets.sh
          sh scripts/build-portable.sh
          python3 tests/test_integration.py 2>&1 | tee dist/validation/cli-tests.log
          python3 tests/test_collector.py 2>&1 | tee dist/validation/collector-tests.log
          python3 tests/test_repository.py 2>&1 | tee dist/validation/repository-tests.log
          python3 tests/test_release_tools.py 2>&1 | tee dist/validation/release-tools-tests.log
          git rev-parse HEAD > dist/validation/source-commit.txt
      - name: Debian 12 and 13 installation and removal
        shell: bash
        run: |
          set -euo pipefail
          for suite in bookworm trixie; do
            mkdir -p "dist/package-tests/$suite"
            docker run --rm --cpus=2 --memory=1536m --memory-swap=1536m --pids-limit=512 \
              -e DAYLIGHT_DISPOSABLE_TEST=yes -v "$PWD:/src:ro" \
              -v "$PWD/dist/package-tests/$suite:/out" "debian:$suite" \
              /bin/sh /src/scripts/test-packages.sh 2>&1 | tee "dist/package-tests/$suite/lifecycle.log"
          done
      - name: Build the live ISO only in the disposable runner
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --privileged --cpus=2 --memory=5g -v "$PWD:/src" -w /src debian:trixie /bin/sh -ec '
            apt-get update -qq
            apt-get install -y --no-install-recommends python3 live-build debootstrap squashfs-tools xorriso isolinux syslinux-common grub-pc-bin grub-efi-amd64-bin mtools dosfstools ca-certificates
            /bin/sh scripts/build-live.sh' 2>&1 | tee dist/validation/live-build.log
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Offline live-filesystem boot and screenshot
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-live.py dist/daylight-live_5.0.0-rc.2_amd64.iso --timeout 600
          convert dist/live-test/desktop.ppm dist/live-test/desktop.png
      - name: Real BIOS and UEFI ISO bootloader tests
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          for firmware in bios uefi; do
            python3 scripts/test-boot.py dist/daylight-live_5.0.0-rc.2_amd64.iso --firmware "$firmware" --timeout 600
            convert "dist/boot-$firmware/desktop.ppm" "dist/boot-$firmware/desktop.png"
          done
      - name: Real browser connection to the candidate live guest
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv dist/browser-venv
          dist/browser-venv/bin/pip install playwright==1.55.0
          dist/browser-venv/bin/python tests/test_browser_demo.py
      - name: Final candidate integrity manifest
        if: github.event_name != 'pull_request'
        run: cd dist && sha256sum ./*.deb ./*.iso > SHA256SUMS
      - name: Make disposable-container evidence readable
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" dist && chmod -R u+rwX dist
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-validation-${{ github.run_number }}
          path: |
            dist/validation/
            dist/package-tests/
            dist/live-test/
            dist/boot-bios/
            dist/boot-uefi/
            dist/browser-demo/
          retention-days: 14
          if-no-files-found: warn
      - name: Retain candidate packages and image
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-candidate-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/*.iso
            dist/SHA256SUMS
          retention-days: 2
          compression-level: 0
          if-no-files-found: warn
