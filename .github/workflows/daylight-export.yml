name: Export validated Daylight artifacts
on:
  push:
    branches: [build/daylight-v5]
    paths: [release/EXPORT.json]
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve and verify the successful candidate
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run=json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/41357700732']))
          if run['conclusion']!='success' or run['head_sha']!='85715705501b18138712173327b7df1fb63ef889':
              raise SystemExit('The exact candidate did not pass validation')
          PY
          gh run download 41357700732 --name daylight-candidate-9 --dir exported
          gh run download 41357700732 --name daylight-validation-9 --dir validation
          cd exported
          sha256sum -c SHA256SUMS
      - name: Export source, packages and exact component provenance
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xorriso squashfs-tools
          python3 release/package-manifest.py exported/daylight-live_5.0.0-rc.1_amd64.iso --commit 85715705501b18138712173327b7df1fb63ef889 --output validation
          git archive --format=tar.gz --prefix=Daylight-GNU-Linux-5.0.0-rc.1/ 85715705501b18138712173327b7df1fb63ef889 > exported/daylight-source_5.0.0-rc.1.tar.gz
          python3 - <<'PY'
          import pathlib, shutil
          shutil.make_archive('exported/daylight-validation','zip','validation')
          shutil.copyfile('validation/live-test/desktop.png','exported/daylight-live-desktop.png')
          PY
          mkdir -p exported/packages
          cp exported/*.deb exported/packages/
          cd exported/packages
          sha256sum *.deb > PACKAGES-SHA256SUMS
      - name: Split the ISO only for bounded file transport
        run: |
          mkdir -p exported/iso-parts
          split -b 450M -d -a 2 exported/daylight-live_5.0.0-rc.1_amd64.iso exported/iso-parts/daylight-live.iso.part-
          test "$(find exported/iso-parts -type f | wc -l)" -eq 3
          cp exported/SHA256SUMS exported/iso-parts/
          cd exported/iso-parts
          sha256sum daylight-live.iso.part-* > PARTS-SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-source-packages-evidence
          path: |
            exported/packages/
            exported/daylight-source_5.0.0-rc.1.tar.gz
            exported/daylight-validation.zip
            exported/daylight-live-desktop.png
            exported/iso-parts/SHA256SUMS
            exported/iso-parts/PARTS-SHA256SUMS
          retention-days: 14
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-iso-part-00
          path: exported/iso-parts/daylight-live.iso.part-00
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-iso-part-01
          path: exported/iso-parts/daylight-live.iso.part-01
          retention-days: 3
          compression-level: 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: daylight-iso-part-02
          path: exported/iso-parts/daylight-live.iso.part-02
          retention-days: 3
          compression-level: 0
