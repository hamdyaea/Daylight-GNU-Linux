name: Finalize verified candidate draft
on:
  push:
    branches: [build/daylight-v5]
    paths: [release/FINALIZE.json]
permissions:
  contents: write
  actions: write
jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify the exact private draft and the successful validation
        run: |
          mkdir verified
          gh api repos/$GH_REPO/releases/430912957 > verified/release.json
          gh api repos/$GH_REPO/actions/runs/41357700732 > verified/run.json
          python3 - <<'PY'
          import json
          release=json.load(open('verified/release.json'))
          run=json.load(open('verified/run.json'))
          commit='85715705501b18138712173327b7df1fb63ef889'
          assert release['draft'] and release['prerelease'], 'Do not modify a published release'
          assert release['tag_name']=='v5.0.0-rc.1' and release['target_commitish']==commit
          assert run['conclusion']=='success' and run['head_sha']==commit
          assert run['path']=='.github/workflows/daylight-build.yml'
          assert len(release['assets'])==14 and all(a['state']=='uploaded' for a in release['assets'])
          PY
          gh release download v5.0.0-rc.1 --pattern SHA256SUMS --pattern daylight-validation.zip --dir verified
      - name: Validate every uploaded content digest and repair only sanitized names
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,re,zipfile
          root=pathlib.Path('verified')
          release=json.loads((root/'release.json').read_text())
          assets={a['name']:a for a in release['assets']}
          expected={}
          for line in (root/'SHA256SUMS').read_text().splitlines():
              digest,name=line.split(maxsplit=1)
              assert re.fullmatch('[0-9a-f]{64}',digest)
              name=name.lstrip('*').removeprefix('./')
              assert '/' not in name and '..' not in name
              normalized=name.replace('~','.') if name.endswith('.deb') else name
              assert normalized not in expected
              expected[normalized]=digest
              assert assets[normalized]['digest']=='sha256:'+digest, normalized+' digest mismatch'
          assert set(assets)==set(expected)|{'SHA256SUMS'}
          data=(root/'daylight-validation.zip').read_bytes()
          assert hashlib.sha256(data).hexdigest()==expected['daylight-validation.zip']
          with zipfile.ZipFile(root/'daylight-validation.zip') as archive:
              for suite in ('bookworm','trixie'):
                  assert b'DAYLIGHT_PACKAGE_LIFECYCLE_OK' in archive.read('package-tests/'+suite+'/lifecycle.log')
              assert archive.read('live-test/result.txt').startswith(b'PASS:')
              assert archive.read('validation/source-commit.txt').decode().strip()=='85715705501b18138712173327b7df1fb63ef889'
              provenance=json.loads(archive.read('daylight-live-packages.json'))
              assert any(p['package']=='user-setup' for p in provenance['packages'])
          (root/'SHA256SUMS').write_text(''.join(expected[n]+'  '+n+'\n' for n in sorted(expected)))
          print('All 13 payload digests and validation evidence agree; only Debian filename spelling changed.')
          PY
          gh release upload v5.0.0-rc.1 verified/SHA256SUMS --clobber
      - name: Publish the verified prerelease
        run: |
          gh release edit v5.0.0-rc.1 --draft=false
          gh api repos/$GH_REPO/releases/430912957 > verified/published.json
          python3 - <<'PY'
          import hashlib,json,pathlib
          r=json.load(open('verified/published.json'))
          assert not r['draft'] and r['prerelease'] and len(r['assets'])==14
          asset=next(a for a in r['assets'] if a['name']=='SHA256SUMS')
          assert asset['digest']=='sha256:'+hashlib.sha256(pathlib.Path('verified/SHA256SUMS').read_bytes()).hexdigest()
          print('Published:',r['html_url'])
          PY
      - name: Remove only redundant artifacts and duplicate validation of the same source
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json,os,subprocess
          prefix='repos/'+os.environ['GH_REPO']
          def get(path): return json.loads(subprocess.check_output(['gh','api',prefix+path]))
          for a in get('/actions/runs/41357700732/artifacts')['artifacts']:
              if a['name']=='daylight-candidate-9':
                  subprocess.run(['gh','api','--method','DELETE',prefix+'/actions/artifacts/'+str(a['id'])],check=True)
          for r in get('/actions/runs?branch=master&per_page=10')['workflow_runs']:
              if r['head_sha']=='85715705501b18138712173327b7df1fb63ef889' and r['path']=='.github/workflows/daylight-build.yml' and r['status'] in ('queued','in_progress'):
                  subprocess.run(['gh','api','--method','POST',prefix+'/actions/runs/'+str(r['id'])+'/cancel'],check=True)
          PY
