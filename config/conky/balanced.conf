-- Adapted from Daylight Version4/etc/skel/.conkyrc.
conky.config = {
    alignment = 'top_right', gap_x = 13, gap_y = 34,
    minimum_width = 330, maximum_width = 330, border_inner_margin = 7,
    background = false, double_buffer = true, update_interval = 1,
    own_window = true, own_window_type = 'desktop',
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    own_window_argb_visual = true, own_window_argb_value = 178,
    own_window_transparent = false, own_window_colour = '17131e',
    use_xft = true, font = 'DejaVu Sans Mono:size=8',
    default_color = 'ffffff', color1 = 'cecad4', color2 = 'b78aff',
    color3 = '22ccff', color4 = 'ffca54', draw_graph_borders = true,
    draw_shades = false, draw_outline = false, draw_borders = false,
    cpu_avg_samples = 2, net_avg_samples = 2, no_buffers = true,
    short_units = true, top_name_width = 18,
};

conky.text = [[
${font DejaVu Sans Mono:bold:size=12}DAYLIGHT${font} ${alignr}${nodename}
${color1}${sysname} ${kernel} · ${machine}${color}
${stippled_hr 3}
Uptime ${uptime_short} ${alignr}Load ${loadavg}
CPU ${cpu}% ${color2}${cpubar 5}${color}
${color1}${cpugraph 31,330 261036 9955ff}${color}
RAM  ${mem}/${memmax} · ${memperc}% ${membar 4}
Swap ${swap}/${swapmax} · ${swapperc}% ${swapbar 4}
Processes ${processes} ${alignr}Running ${running_processes}
${stippled_hr 3}
Networking ${alignr}${color1}@@INTERFACE@@${color}
Down ${color2}${downspeed @@INTERFACE@@}${color} ${goto 174}Up ${color3}${upspeed @@INTERFACE@@}${color}
${color1}${downspeedgraph @@INTERFACE@@ 32,156 ff3030 3030ff} ${alignr}${upspeedgraph @@INTERFACE@@ 32,156 3030ff ff3030}${color}
${stippled_hr 3}
File systems
/  ${fs_used /}/${fs_size /} ${fs_bar 5 /}
${stippled_hr 3}
Top CPU ${goto 186}PID ${goto 235}CPU% ${alignr}MEM%
${color4}${top name 1}${goto 174}${top pid 1}${goto 225}${top cpu 1}${alignr}${top mem 1}${color}
${top name 2}${goto 174}${top pid 2}${goto 225}${top cpu 2}${alignr}${top mem 2}
${top name 3}${goto 174}${top pid 3}${goto 225}${top cpu 3}${alignr}${top mem 3}
${stippled_hr 3}
Top memory ${goto 186}PID ${goto 235}CPU% ${alignr}MEM%
${color4}${top_mem name 1}${goto 174}${top_mem pid 1}${goto 225}${top_mem cpu 1}${alignr}${top_mem mem 1}${color}
${top_mem name 2}${goto 174}${top_mem pid 2}${goto 225}${top_mem cpu 2}${alignr}${top_mem mem 2}
${top_mem name 3}${goto 174}${top_mem pid 3}${goto 225}${top_mem cpu 3}${alignr}${top_mem mem 3}
${stippled_hr 3}
${color1}${time %a %d %b} ${alignr}${time %H:%M} · ${execi 15 /usr/bin/daylight sensor}${color}
]]
