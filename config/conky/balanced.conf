conky.config = {
 alignment = 'top_right', background = false, double_buffer = true,
 own_window = true, own_window_type = 'desktop',
 own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
 own_window_transparent = false, own_window_colour = '131d29',
 use_xft = true, font = 'DejaVu Sans Mono:size=10',
 default_color = 'e8edf3', color1 = 'f5c777',
 draw_shades = false, draw_outline = false, draw_borders = false,
 minimum_width = 290, maximum_width = 290, gap_x = 28, gap_y = 38,
 cpu_avg_samples = 2, net_avg_samples = 2, no_buffers = true,
 update_interval = 2,
};
conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=15}DAYLIGHT${font}${color}
${color1}GNU/Linux${color}  ${alignr}${machine}
${hr 1}
Uptime ${alignr}${uptime_short}
CPU ${alignr}${cpu}%
RAM ${alignr}${mem} / ${memmax}
Root ${alignr}${fs_used /} / ${fs_size /}
${cpubar 4}
${membar 4}
Temperature ${alignr}${execi 10 /usr/bin/daylight sensor}
${hr 1}
Network: @@INTERFACE@@
Down ${alignr}${downspeed @@INTERFACE@@}
Up ${alignr}${upspeed @@INTERFACE@@}
${hr 1}
${time %A %d %B}
${font DejaVu Sans Mono:size=20}${time %H:%M}${font}
]];
