-- Web preview: low-overhead, transparent X11 overlay, no network polling.
conky.config = {
 alignment = 'top_right', background = true, double_buffer = true,
 own_window = true, own_window_type = 'desktop',
 own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
 own_window_transparent = true,
 use_xft = true, font = 'DejaVu Sans Mono:size=11',
 default_color = 'ffffff', color1 = 'ffd27a',
 draw_shades = true, default_shade_color = '121a20',
 draw_outline = false, draw_borders = false,
 minimum_width = 260, maximum_width = 260, gap_x = 25, gap_y = 24,
 cpu_avg_samples = 2, no_buffers = true, update_interval = 3,
};
conky.text = [[
${color1}${font DejaVu Sans Mono:bold:size=16}DAYLIGHT${font}${color}
${color1}GNU/Linux${color}
${hr 1}
Uptime  ${alignr}${uptime_short}
CPU     ${alignr}${cpu}%
RAM     ${alignr}${mem} / ${memmax}
Root    ${alignr}${fs_used /} / ${fs_size /}
${cpubar 5}
${membar 5}
${hr 1}
${time %a %d %b}  ${alignr}${time %H:%M}
]]
